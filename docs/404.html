<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · 页面不存在 — ARK</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#fbbf24;--blue:#3b82f6;--text:#e2e8f0;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:560px;width:100%}
  .code{font-size:5rem;font-weight:800;background:linear-gradient(90deg,#60a5fa,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  h1{font-size:1.5rem;margin:16px 0 8px}
  p{color:var(--muted);margin-bottom:24px}
  a.btn{display:inline-block;background:var(--accent);color:#0f172a;font-weight:600;text-decoration:none;padding:10px 24px;border-radius:8px;transition:opacity .15s}
  a.btn:hover{opacity:.85}
  .hint{margin-top:20px;font-size:.8rem;color:#64748b}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>你访问的页面不存在、已被移动，或从未存在过。<br>这里是 ARK — Agent Reliability Kit 的信任基础设施。</p>
  <a class="btn" href="/">← 返回 ARK 首页</a>
  <p class="hint">🛡 此页面由 ARK 巡航修复上线：任意不存在路径现返回真实 404，不再伪装成首页 200。</p>
</div>
</body>
</html>
