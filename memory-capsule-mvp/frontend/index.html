<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔱 个人记忆胶囊 - Memory Capsule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 主容器 */
        .main {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        /* 侧边栏 */
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #999;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .sidebar-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f5f5f5;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        /* 内容区 */
        .content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        /* 文档列表 */
        .documents {
            display: grid;
            gap: 15px;
        }

        .document-item {
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .document-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .document-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .document-snippet {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .document-meta {
            font-size: 12px;
            color: #999;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            clear: both;
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.8;
            color: #666;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        /* 成功提示 */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .success-icon {
            color: #28a745;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">🔱 Memory Capsule</div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="connectFeishu()">连接飞书</button>
                <button class="btn btn-secondary" onclick="showSettings()">设置</button>
            </div>
        </div>

        <!-- 主容器 -->
        <div class="main">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-title">导航</div>
                <div class="sidebar-item active" onclick="showPage('home')">📊 首页</div>
                <div class="sidebar-item" onclick="showPage('search')">🔍 搜索</div>
                <div class="sidebar-item" onclick="showPage('review')">📅 周回顾</div>
                <div class="sidebar-item" onclick="showPage('settings')">⚙️ 设置</div>
            </div>

            <!-- 内容区 -->
            <div class="content">
                <!-- 首页 -->
                <div id="page-home" class="page">
                    <div id="success-message"></div>
                    
                    <h2 style="margin-bottom: 20px;">📊 仪表板</h2>
                    
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-label">总文档数</div>
                            <div class="stat-value" id="stat-total">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">本周新增</div>
                            <div class="stat-value" id="stat-week">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">最后同步</div>
                            <div class="stat-value" style="font-size: 14px;" id="stat-sync">刚刚</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 15px;">📝 最近文档</h3>
                    <div id="documents-list" class="documents"></div>
                </div>

                <!-- 搜索页 -->
                <div id="page-search" class="page" style="display: none;">
                    <h2 style="margin-bottom: 20px;">🔍 搜索</h2>
                    <div class="search-box">
                        <input type="text" class="search-input" id="search-input" placeholder="输入关键词搜索...">
                        <button class="btn btn-primary" onclick="performSearch()">搜索</button>
                    </div>
                    <div id="search-results" class="documents"></div>
                </div>

                <!-- 周回顾页 -->
                <div id="page-review" class="page" style="display: none;">
                    <h2 style="margin-bottom: 20px;">📅 周回顾</h2>
                    <div id="review-content"></div>
                </div>

                <!-- 设置页 -->
                <div id="page-settings" class="page" style="display: none;">
                    <h2 style="margin-bottom: 20px;">⚙️ 设置</h2>
                    <div style="padding: 20px; background: #f5f5f5; border-radius: 8px;">
                        <h3 style="margin-bottom: 15px;">飞书集成</h3>
                        <p style="margin-bottom: 15px; color: #666;">
                            点击下方按钮连接您的飞书账号，应用将自动同步您的所有文档。
                        </p>
                        <button class="btn btn-primary" onclick="connectFeishu()">连接飞书账号</button>
                        
                        <h3 style="margin-top: 30px; margin-bottom: 15px;">数据管理</h3>
                        <button class="btn btn-secondary" onclick="syncDocuments()">立即同步</button>
                        <button class="btn btn-secondary" onclick="clearData()" style="margin-left: 10px;">清空本地数据</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文档详情模态框 -->
    <div id="document-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api";

        // 页面切换
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(`page-${page}`).style.display = 'block';
            
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');

            if (page === 'home') {
                loadHome();
            } else if (page === 'review') {
                loadWeeklyReview();
            }
        }

        // 加载首页
        async function loadHome() {
            try {
                // 获取统计信息
                const statsRes = await fetch(`${API_URL}/stats`);
                const stats = await statsRes.json();
                document.getElementById('stat-total').textContent = stats.total_documents;
                document.getElementById('stat-week').textContent = stats.this_week;

                // 获取文档列表
                const docsRes = await fetch(`${API_URL}/documents?limit=10`);
                const docsData = await docsRes.json();
                
                const list = document.getElementById('documents-list');
                list.innerHTML = docsData.documents.map(doc => `
                    <div class="document-item" onclick="showDocument(${doc.id}, '${doc.title}')">
                        <div class="document-title">${doc.title}</div>
                        <div class="document-snippet">${doc.snippet}</div>
                        <div class="document-meta">修改于: ${new Date(doc.modified_time).toLocaleDateString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载首页失败:', error);
            }
        }

        // 搜索
        async function performSearch() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            try {
                const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                const results = document.getElementById('search-results');
                if (data.results.length === 0) {
                    results.innerHTML = '<p style="text-align: center; color: #999;">未找到相关文档</p>';
                } else {
                    results.innerHTML = data.results.map(result => `
                        <div class="document-item" onclick="showDocument(${result.id}, '${result.title}')">
                            <div class="document-title">${result.title}</div>
                            <div class="document-snippet">${result.snippet}</div>
                            <div class="document-meta">相关度: ${(result.score * 100).toFixed(0)}%</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('搜索失败:', error);
            }
        }

        // 周回顾
        async function loadWeeklyReview() {
            try {
                const res = await fetch(`${API_URL}/weekly-review`);
                const data = await res.json();
                
                const content = document.getElementById('review-content');
                content.innerHTML = `
                    <div style="padding: 20px; background: #f5f5f5; border-radius: 8px; margin-bottom: 20px;">
                        <p style="color: #666; margin-bottom: 10px;">📅 ${data.week}</p>
                        <p style="font-size: 18px; font-weight: bold;">本周共新增 <span style="color: #667eea;">${data.total_documents}</span> 份文档</p>
                    </div>
                    <div class="documents">
                        ${data.documents.map(doc => `
                            <div class="document-item" onclick="showDocument(${doc.id}, '${doc.title}')">
                                <div class="document-title">${doc.title}</div>
                                <div class="document-snippet">${doc.snippet}</div>
                                <div class="document-meta">修改于: ${new Date(doc.modified_time).toLocaleDateString()}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('加载周回顾失败:', error);
            }
        }

        // 显示文档详情
        async function showDocument(docId, title) {
            try {
                const res = await fetch(`${API_URL}/documents/${docId}`);
                const doc = await res.json();
                
                document.getElementById('modal-title').textContent = doc.title;
                document.getElementById('modal-body').innerHTML = `
                    <p style="margin-bottom: 15px;">${doc.content}</p>
                    <hr style="margin: 20px 0;">
                    <p style="font-size: 12px; color: #999;">
                        创建于: ${new Date(doc.created_time).toLocaleString()}<br>
                        修改于: ${new Date(doc.modified_time).toLocaleString()}
                    </p>
                `;
                document.getElementById('document-modal').classList.add('active');
            } catch (error) {
                console.error('加载文档失败:', error);
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('document-modal').classList.remove('active');
        }

        // 连接飞书
        async function connectFeishu() {
            try {
                const res = await fetch(`${API_URL}/auth/feishu/authorize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ redirect_uri: window.location.href })
                });
                const data = await res.json();
                
                if (data.success) {
                    showSuccessMessage(data.message);
                    setTimeout(() => loadHome(), 1000);
                }
            } catch (error) {
                console.error('连接飞书失败:', error);
            }
        }

        // 同步文档
        async function syncDocuments() {
            try {
                const res = await fetch(`${API_URL}/documents/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ force: true })
                });
                const data = await res.json();
                showSuccessMessage(data.message);
                setTimeout(() => loadHome(), 1000);
            } catch (error) {
                console.error('同步失败:', error);
            }
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const msgDiv = document.getElementById('success-message');
            msgDiv.innerHTML = `<div class="success-message"><span class="success-icon">✓</span>${message}</div>`;
            setTimeout(() => {
                msgDiv.innerHTML = '';
            }, 3000);
        }

        // 清空数据
        function clearData() {
            if (confirm('确定要清空所有本地数据吗？此操作不可撤销。')) {
                alert('数据已清空');
                location.reload();
            }
        }

        // 显示设置
        function showSettings() {
            showPage('settings');
        }

        // 初始化
        window.addEventListener('load', () => {
            loadHome();
        });

        // 回车搜索
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('search-input') === document.activeElement) {
                performSearch();
            }
        });

        // 点击模态框外部关闭
        document.getElementById('document-modal').addEventListener('click', (e) => {
            if (e.target.id === 'document-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
