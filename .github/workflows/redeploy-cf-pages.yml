name: Trigger CF Pages Redeploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Trigger CF Pages Deploy
        run: |
          echo "Triggering CF Pages redeploy: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Deploy timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> ark-pro/deploy-marker.txt
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add ark-pro/deploy-marker.txt
          git commit -m "chore: trigger CF Pages redeploy $(date +'%Y%m%d-%H%M%S')"
          git push origin main
